<svg id="deskscene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110"
     preserveAspectRatio="xMidYMax slice" shape-rendering="crispEdges" aria-hidden="true">
<style>
  #deskscene .cur { animation: blink 1.06s steps(1) infinite; }
  @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
  #deskscene .tl { opacity: 0 }
  #deskscene .t0 { animation: typ 9s steps(1) infinite }
  #deskscene .t1 { animation: typ 9s steps(1) 3s infinite }
  #deskscene .t2 { animation: typ 9s steps(1) 6s infinite }
  @keyframes typ { 0%,4% { opacity: 0 } 5%,92% { opacity: 1 } 93%,100% { opacity: 0 } }
  #deskscene .key { opacity: 0 }
  #deskscene .k0 { animation: kf .52s steps(1) infinite }
  #deskscene .k1 { animation: kf .52s steps(1) .13s infinite }
  #deskscene .k2 { animation: kf .52s steps(1) .26s infinite }
  #deskscene .k3 { animation: kf .52s steps(1) .39s infinite }
  @keyframes kf { 0%,18% { opacity: 1 } 19%,100% { opacity: 0 } }
  #deskscene #handA { animation: hand .34s steps(1) infinite }
  @keyframes hand { 0%,50% { transform: translateY(0) } 51%,100% { transform: translateY(-1px) } }
  #deskscene .st { opacity: 0 }
  #deskscene .s0 { animation: steam 3.4s linear infinite }
  #deskscene .s1 { animation: steam 3.4s linear 1.1s infinite }
  #deskscene .s2 { animation: steam 3.4s linear 2.2s infinite }
  @keyframes steam {
    0% { opacity: 0; transform: translateY(0) }
    20% { opacity: .55 }
    100% { opacity: 0; transform: translateY(-7px) }
  }
  #deskscene .cw { opacity: 0 }
  #deskscene .c0 { animation: win 11s steps(1) infinite }
  #deskscene .c1 { animation: win 13s steps(1) 4s infinite }
  #deskscene .c2 { animation: win 9s steps(1) 7s infinite }
  @keyframes win { 0%,45% { opacity: 1 } 46%,100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) {
    #deskscene * { animation: none !important }
    #deskscene .tl, #deskscene .st, #deskscene .cw { opacity: .6 }
  }
</style>
