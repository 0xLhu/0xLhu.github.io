baseURL = 'https://0xlhu.github.io/'
title = '0xLhu'
theme = 'PaperMod'
enableRobotsTXT = true
enableEmoji = false
summaryLength = 40

defaultContentLanguage = 'fr'
defaultContentLanguageInSubdir = true

[pagination]
  pagerSize = 10

[params]
  defaultTheme = 'dark'
  ShowReadingTime = true
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  hideMeta = false
  disableScrollToTop = false
  keywords = ["CTI", "threat intelligence", "detection engineering", "malware", "SOC"]

  [params.profileMode]
    enabled = false

  [params.assets]
    disableHLJS = true

  [params.cover]
    linkFullImages = true
    responsiveImages = true

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/0xLhu"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/nourdine-bena/"

[[params.socialIcons]]
  name = "rss"
  url = "index.xml"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  style = 'dracula'
  noClasses = false
  lineNos = true
  tabWidth = 4

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[languages]
  [languages.fr]
    contentDir = 'content/fr'
    locale = 'fr-FR'
    label = 'Français'
    weight = 1
    title = '0xLhu'
    [languages.fr.params]
      description = "Renseignement sur la menace, ingénierie de détection et recherche appliquée aux malwares."
    [languages.fr.params.homeInfoParams]
      Title = "chasser les menaces pour que d'autres n'aient pas à le faire"
      Content = "CTI, ingénierie de détection et recherche appliquée. J'écris ce que j'apprends, y compris quand ça rate."
    [[languages.fr.menu.main]]
      name = "Articles"
      url = "/fr/posts/"
      weight = 10
    [[languages.fr.menu.main]]
      name = "Tags"
      url = "/fr/tags/"
      weight = 20
    [[languages.fr.menu.main]]
      name = "À propos"
      url = "/fr/about/"
      weight = 30

  [languages.en]
    contentDir = 'content/en'
    locale = 'en-US'
    label = 'English'
    weight = 2
    title = '0xLhu'
    [languages.en.params]
      description = "Threat intelligence, detection engineering and applied malware research."
    [languages.en.params.homeInfoParams]
      Title = "hunting threats so you don't have to"
      Content = "CTI, detection engineering and applied research. I write what I learn, including when it fails."
    [[languages.en.menu.main]]
      name = "Posts"
      url = "/en/posts/"
      weight = 10
    [[languages.en.menu.main]]
      name = "Tags"
      url = "/en/tags/"
      weight = 20
    [[languages.en.menu.main]]
      name = "About"
      url = "/en/about/"
      weight = 30
